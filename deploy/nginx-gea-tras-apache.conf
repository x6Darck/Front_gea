

proxy_cache_path /var/cache/nginx/gea_public levels=1:2 keys_zone=gea_public_cache:10m max_size=100m inactive=60s use_temp_path=off;

server {

    listen ;
    server_name _;

    client_max_body_size 12M; 

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;


    root /var/www/gea-front;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }


    location ~ ^/app/(index\.html|manifest\.json|version\.json|flutter_service_worker\.js)$ {
        alias /var/www/gea-app-pwa/$1;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/app/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|json))$ {
        alias /var/www/gea-app-pwa/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /app/ {
        alias /var/www/gea-app-pwa/;
        try_files $uri $uri/ /app/index.html;
    }


    location /api/archivos/public/ {
        proxy_pass ;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }


    location ~ ^/api/app/(eventos|anuncios)/publicados {
        proxy_pass ;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache gea_public_cache;
        proxy_cache_valid 200 20s;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }


    location /api/ {
        proxy_pass ;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/gea-front;
    }
}
