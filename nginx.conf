
proxy_cache_path /var/cache/nginx/gea_public levels=1:2 keys_zone=gea_public_cache:10m max_size=100m inactive=60s use_temp_path=off;

server {
    listen 80;
    server_name _;
    # Redirige todo a HTTPS salvo el reto ACME de Let's Encrypt (renovación
    # de certificado), que debe poder responderse por HTTP sin redirigir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12M; # coherente con multipart 10MB del backend + margen

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Frontend estático (build de Vite) ──────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # ── Archivos públicos (piezas gráficas): cacheables, no cambian tras
    # subirse. Sin este header, cada scroll por el calendario/anuncios
    # re-descarga las mismas imágenes del backend (Tarea 3.3 del plan). ──
    location /api/archivos/public/ {
        proxy_pass http://backend:8080/api/archivos/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El backend (Spring Security) manda su propio Cache-Control
        # defensivo (no-cache/no-store) en TODAS las respuestas. add_header
        # no sobreescribe un header que el upstream ya envió con el mismo
        # nombre — hay que ocultarlo primero para que el nuestro aplique.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Micro-caché de lectura pública (Tarea 3.4, opcional): absorbe
    # ráfagas idénticas (deep links, polling) sin tocar la JVM ni MySQL.
    # Solo GET, sin personalización por usuario — nunca cachear rutas
    # autenticadas. ──
    location ~ ^/api/app/(eventos|anuncios)/publicados {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El backend (Spring Security) manda Cache-Control: no-store en TODAS
        # sus respuestas por defecto; sin esto, proxy_cache respeta ese header
        # del upstream y nunca cachea nada, sin importar proxy_cache_valid.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache gea_public_cache;
        proxy_cache_valid 200 20s;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── API general: todo lo demás bajo /api/ ──────────────────────────
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
